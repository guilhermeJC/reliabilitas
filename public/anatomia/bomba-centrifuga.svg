<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Corte técnico de bomba centrífuga horizontal monoestágio (OH1): voluta aberta com impelidor, caixa de selagem com selo mecânico, caixa de mancais com rolamentos e carter de óleo, acoplamento com proteção; a linha tracejada indica o caminho do fluido da sucção ao recalque">
  <!-- RELIABILITAS — anatomia: bomba centrífuga OH1, corte técnico (v2, sessão 5).
       Asset PRÓPRIO (DEV-025/BR-009). A página do handbook sobrepõe hotspots
       interativos numerados nestes pontos de ancoragem; o fluxo (laranja
       tracejado) mostra entrada → rotor → voluta → saída. -->
