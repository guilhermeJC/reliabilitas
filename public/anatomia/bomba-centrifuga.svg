  <rect x="630" y="206" width="18" height="32" rx="3" fill="#e9edf3" stroke="#12233F" stroke-width="2"/>
  <rect x="626" y="200" width="26" height="8" rx="2" fill="#c3ccd9" stroke="#12233F" stroke-width="1.5"/>
