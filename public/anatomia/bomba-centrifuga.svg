  <rect x="30" y="245" width="20" height="110" rx="2" fill="#d3dae6" stroke="#12233F" stroke-width="2.5"/>
  <circle cx="40" cy="258" r="3" fill="#94a3b8"/>
  <circle cx="40" cy="300" r="3" fill="#94a3b8"/>
  <circle cx="40" cy="342" r="3" fill="#94a3b8"/>
