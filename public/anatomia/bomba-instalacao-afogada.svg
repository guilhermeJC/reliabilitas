<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instalação com sucção afogada: o tanque de sucção fica acima da bomba, o nível de líquido está acima da linha de centro do rotor — H_s soma-se ao NPSHa, condição favorável">
  <!-- RELIABILITAS — instalação da bomba: sucção afogada (asset próprio, DEV-025/BR-009) -->

  <!-- Tanque -->
  <rect x="40" y="30" width="130" height="150" fill="#e9edf3" stroke="#12233F" stroke-width="2.5"/>
  <!-- Líquido (nível marcado) -->
  <rect x="44" y="70" width="122" height="106" fill="#e7f0fa" stroke="none"/>
  <line x1="40" y1="70" x2="170" y2="70" stroke="#12233F" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="176" y="74" font-size="12" fill="#12233F" font-family="sans-serif">Nível</text>

  <!-- Linha de centro do rotor (referência de cota) -->
  <line x1="20" y1="230" x2="330" y2="230" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="336" y="234" font-size="11" fill="#5f6b7f" font-family="sans-serif">linha de centro</text>

  <!-- Cota Hs: do nível até a linha de centro (favorável = soma) -->
  <line x1="200" y1="70" x2="200" y2="230" stroke="#E8510A" stroke-width="2"/>
  <path d="M195 78 L200 70 L205 78" fill="none" stroke="#E8510A" stroke-width="2"/>
  <path d="M195 222 L200 230 L205 222" fill="none" stroke="#E8510A" stroke-width="2"/>
  <text x="208" y="153" font-size="14" fill="#E8510A" font-family="sans-serif" font-weight="600">H_s</text>
  <text x="208" y="170" font-size="11" fill="#12233F" font-family="sans-serif">soma ao NPSHa</text>

  <!-- Tubulação de sucção: desce do tanque até a bomba (abaixo do nível) -->
  <path d="M170 160 L250 160 L250 225" fill="none" stroke="#12233F" stroke-width="6" stroke-linecap="round"/>

  <!-- Bomba (ícone simplificado) -->
  <circle cx="270" cy="230" r="26" fill="#dbe3ee" stroke="#12233F" stroke-width="2.5"/>
  <rect x="252" y="256" width="36" height="14" fill="#d3dae6" stroke="#12233F" stroke-width="2"/>
  <text x="270" y="235" font-size="11" fill="#12233F" font-family="sans-serif" text-anchor="middle" font-weight="600">B</text>

  <!-- Recalque -->
  <path d="M296 230 L340 230 L340 190" fill="none" stroke="#E8510A" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#seta1)"/>
  <defs>
    <marker id="seta1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8510A"/>
    </marker>
  </defs>
  <text x="344" y="185" font-size="11" fill="#12233F" font-family="sans-serif">recalque</text>
</svg>
