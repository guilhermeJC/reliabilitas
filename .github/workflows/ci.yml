name: CI

# F18: push só em main (evita run duplicado no mesmo branch quando há PR aberto).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions pinadas por SHA (supply-chain — tag pode ser reapontada pelo dono)
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # A imagem do Node 22 traz npm 10.x, mas o desenvolvimento roda em npm 11 —
      # e um lock gerado pelo npm 11 pode ser REJEITADO pelo npm 10.
      # Isso já derrubou o CI 3 vezes, a última custando 5 dias de atraso silencioso
      # (DEV-125). Alinhar a versão aqui elimina a classe inteira de falha, em vez
      # de depender de lembrar a regra de regenerar o lock a cada mudança.
      - name: Alinhar npm com o ambiente de desenvolvimento
        run: npm install -g npm@11

      - name: Instalar dependências
        run: npm ci

      # Estágio 1 — estilo/lint/tipos
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

      # Estágio 2 — audit de dependências
      - name: npm audit
        run: npm audit --audit-level=high

      # Estágio 3 — scanner de segurança estático
      - name: Semgrep
        run: |
          pipx install semgrep
          semgrep scan --config p/default --error

      # Estágio 4 — suíte de testes
      - name: Testes (Vitest)
        run: npm test

      # Estágio 4b — RLS contra a instância viva (F6: guarda de regressão do D11).
      # Secrets do repositório; em fork-PR eles não existem — pular com aviso, não falhar.
      - name: Testes de RLS (instância viva)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::secrets do Supabase ausentes — testes de RLS pulados"
            exit 0
          fi
          SUPABASE_DB_TESTS=1 npx vitest run tests/integration

      # Validação de conteúdo (BR-006/BR-001/BR-008 — build falha se inválido)
      - name: Ingest dry-run
        run: npm run ingest:dry

      # Prova de deployability (small releases — cada commit em main é production-ready)
      - name: Build de produção
        run: npm run build

      # Estágio 5 — G5: smoke E2E (4 fluxos críticos), contra o build já
      # gerado acima (mesmo job/filesystem — playwright.config.ts detecta
      # CI e só sobe `next start`, sem rebuildar). Precisa de conteúdo real
      # no banco — mesmos secrets/mesmo padrão de skip gracioso do RLS acima.
      - name: Playwright smoke E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::secrets do Supabase ausentes — smoke E2E pulado"
            exit 0
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e
