name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions pinadas por SHA (supply-chain — tag pode ser reapontada pelo dono)
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Estágio 1 — estilo/lint/tipos
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

      # Estágio 2 — audit de dependências
      - name: npm audit
        run: npm audit --audit-level=high

      # Estágio 3 — scanner de segurança estático
      - name: Semgrep
        run: |
          pipx install semgrep
          semgrep scan --config p/default --error

      # Estágio 4 — suíte de testes
      - name: Testes (Vitest)
        run: npm test

      # Validação de conteúdo (BR-006/BR-001/BR-008 — build falha se inválido)
      - name: Ingest dry-run
        run: npm run ingest:dry

      # Prova de deployability (small releases — cada commit em main é production-ready)
      - name: Build de produção
        run: npm run build
